<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy 3D Split-Plane Parallax Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-shadow: none;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            /* 1. HEAVY TRANSITION: Lowered to 350px for extreme, dramatic wide-angle 3D warping */
            perspective: 1550px; 
            perspective-origin: 50% 20%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            /* Smoothed transition slightly to handle heavy, wide-angle movements cleanly */
            transition: transform 0.2s ease-out;
            will-change: transform;
        }
        .layer {
            position: absolute;
            /* 2. OVER-SCANNING: Expanded to -30%/160% to hide gaps caused by the extreme camera tilts */
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background-size: cover;
            background-position: center;
        }

        /* --- ADDITION 1: BLURRED DEEP BACKDROP LAYER --- */
        #bg-deep {
            background-image: url('background.png'); /* Put your blurred image filename here */
            /* Pushed extremely far back (-500px) and scaled way up (3.0) to keep it behind everything */
            transform: translateZ(-500px) scale(3.0);
            filter: blur(8px); /* Optional fallback blur filter if the image isn't pre-blurred */
            z-index: 0; 
        }

        /* Far Background Base Plane */
        #bg { 
            background-image: url('background.png'); 
            background-repeat: repeat;
            transform: translateZ(-200px) scale(1.0);
            z-index: 1;
        }

        /* 
           3. THREE CUTOUTS ON THE SAME Z-PLANE (100px forward) BUT DIFFERENT X-PLANES:
           - Left Cutout is shifted left using negative translateX.
           - Center Cutout sits perfectly centered at 0px.
           - Right Cutout is shifted right using positive translateX.
           Note: background-size is set to "contain" so the objects don't stretch out of shape.
        */
        .cutout {
            position: absolute;
            bottom: 10%; /* Aligns the cutouts near the bottom area of your screen */
            width: 30%;   /* Gives each cutout a defined width footprint */
            height: 70%;  /* Gives each cutout a defined height footprint */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 2;
        }

        #cutout-left {
            background-image: url('cutout-left.png');
            /* Placed on X: Left side, Z: 100px forward */
            transform: translateX(-120%) translateZ(100px);
        }

        #cutout-center {
            background-image: url('cutout-center.png');
            /* Placed on X: Center, Z: 100px forward */
            transform: translateX(0%) translateZ(100px);
        }

        #cutout-right {
            background-image: url('cutout-right.png');
            /* Placed on X: Right side, Z: 100px forward */
            transform: translateX(120%) translateZ(100px);
        }
    </style>
</head>
<body>

    <div id="scene">
        <!-- --- ADDITION 2: PLACED DEEP BLURRED BG AT THE VERY BOTTOM OF THE STACK --- -->
        <div id="bg-deep" class="layer"></div>

        <!-- Far background sheet -->
        <div id="bg" class="layer"></div>

        <!-- Three foreground cutouts grouped side-by-side inside the 3D grid center -->
        <div style="position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d;">
            <div id="cutout-left" class="cutout"></div>
            <div id="cutout-center" class="cutout"></div>
            <div id="cutout-right" class="cutout"></div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

            /* 
               4. AGGRESSIVE ROTATION: Increased the angle multiplier up to 25 degrees. 
               Combined with the 350px perspective camera proximity, this creates massive 3D depth movement.
            */
            const rotateY = x * 25; 
            const rotateX = y * -25; 

            scene.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
    </script>
</body>
</html>
